<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mausi Studios</title>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --yellow: #f5d000;
      --green: #2e8b22;
      --brown: #5c3010;
      --brown-light: #7a4a1e;
      --white: #fffef5;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: 'Baloo 2', 'Comic Sans MS', cursive;
      background: var(--yellow);
      color: var(--brown);
    }
    h1 {
      font-family: 'Boogaloo', cursive;
      font-size: clamp(3.5rem, 12vw, 7rem);
      line-height: 1;
      color: var(--green);
      text-shadow: 5px 5px 0 var(--brown);
    }
    p {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--brown-light);
      margin-top: 20px;
    }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 28px;
      font-family: 'Boogaloo', cursive;
      font-size: 1.4rem;
      color: var(--brown);
      background: var(--white);
      border: 4px solid var(--brown);
      border-radius: 30px;
      box-shadow: 5px 5px 0 var(--brown);
      text-decoration: none;
      transition: transform 0.15s;
    }
    a:hover { transform: translateY(-4px) rotate(-1deg); }
  </style>
</head>
<body>
  <h1>We're moving!</h1>
  <p>Check if our new page is up.</p>
  <a href="https://mausistudios.github.io">mausistudios.github.io</a>
</body>
</html>
